[project]
name = "data-portal"
version = "0.1.0"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["backend", "frontend"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "A",    # flake8-builtins
    "SIM",  # flake8-simplify
]
ignore = [
    "B008",  # do not perform function calls in argument defaults (FastAPI Depends 허용)
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
warn_return_any = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]

# streamlit.*, pyzipper.* override는 제거함: `make type-check`가 backend/app만 검사하고
# 있어서 (frontend/app은 대상 밖) 실제로는 안 쓰이는 설정이라 mypy가 "unused section"으로
# 경고했음. frontend/app을 type-check 대상에 포함시킬 때 필요하면 다시 추가할 것.

[tool.pytest.ini_options]
testpaths = ["backend/tests", "frontend/tests"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = "-v --tb=short"
