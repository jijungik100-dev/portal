[project]
name = "data-portal"
version = "0.1.0"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["backend", "frontend"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "A",    # flake8-builtins
    "SIM",  # flake8-simplify
]
ignore = [
    "B008",  # do not perform function calls in argument defaults (FastAPI Depends 허용)
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
warn_return_any = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["streamlit.*", "pyzipper.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
# backend와 frontend가 동일하게 "app"/"tests" 패키지명을 쓰기 때문에, 한 pytest 프로세스에서
# 같이 수집하면 모듈명이 충돌한다 (Makefile의 test 타깃이 둘을 별도 프로세스로 분리 실행함).
# 여기서 testpaths를 지정하지 않는 이유도 동일 — bare `pytest`가 둘을 한번에 모으지 않도록 함.
python_files = "test_*.py"
python_functions = "test_*"
addopts = "-v --tb=short"
